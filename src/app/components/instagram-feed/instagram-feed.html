<section class="instagram-feed" aria-labelledby="instagram-title">
  <div class="instagram-feed__inner">
    <header class="instagram-feed__profile" appScrollReveal>
      <a
        class="instagram-feed__icon"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle class="instagram-feed__icon-dot" cx="18" cy="6" r="1"></circle>
        </svg>
      </a>
      <div class="instagram-feed__identity">
        <h2>Vino’s Dance Studio</h2>
        <!-- <p class="instagram-feed__handle">DANCE <i></i> FITNESS <i></i> COMMUNITY</p> -->
        <p class="instagram-feed__categories">Dance · Zumba · Gymnastics · Kathak</p>
      </div>
    </header>

    <div class="instagram-feed__heading" appScrollReveal>
      <p class="instagram-feed__eyebrow">FOLLOW OUR JOURNEY</p>
      <h3 id="instagram-title">Dance. Fitness. Passion.</h3>
      <p>Discover the moments behind every move.</p>
    </div>

    <div class="instagram-feed__grid" aria-label="Dance studio photos">
      @for (photo of photos; track photo.src; let index = $index) {
        <a
          class="instagram-feed__photo"
          appScrollReveal
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'View on Instagram: ' + photo.alt"
        >
          <img [src]="photo.src" [alt]="photo.alt" loading="lazy" />
          @if (index === 0) {
            <span class="instagram-feed__save" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M6 4.75A1.75 1.75 0 0 1 7.75 3h8.5A1.75 1.75 0 0 1 18 4.75V21l-6-4-6 4V4.75Z"></path>
              </svg>
            </span>
          }
        </a>
      }
    </div>

    <a class="instagram-feed__follow" appScrollReveal href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <circle cx="12" cy="12" r="4"></circle>
        <circle class="instagram-feed__icon-dot" cx="18" cy="6" r="1"></circle>
      </svg>
      Follow on Instagram
    </a>
    <p class="instagram-feed__note">A few favorite moments from the studio</p>
  </div>
</section>
